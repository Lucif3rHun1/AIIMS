services:
  bot:
    build: .
    restart: unless-stopped
    stop_grace_period: 20s
    volumes:
      - bot-data:/app/data
    environment:
      TZ: Asia/Kolkata
      AIIMS_MASTER_KEY: ${AIIMS_MASTER_KEY}
    healthcheck:
      # distroless has no shell: the bot probes its own /healthz and exits 0/1.
      test: ["CMD", "/app/bot", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  bot-data:
